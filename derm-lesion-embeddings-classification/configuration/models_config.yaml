models:
  random_forest:
    enabled: true
    default_params:
      n_estimators: 100
      criterion: gini
      max_depth: null
      min_samples_split: 2
      min_samples_leaf: 1
      max_features: sqrt
      random_state: 42
      class_weight: balanced_subsample
      n_jobs: -1

    search_space:
      n_estimators:
        type: int
        low: 100
        high: 800
        step: 100
      max_depth:
        type: int
        low: 3
        high: 20
      min_samples_split:
        type: int
        low: 2
        high: 10
      min_samples_leaf:
        type: int
        low: 1
        high: 5
      max_features:
        type: categorical
        choices: [sqrt, log2, null]
      criterion:
        type: categorical
        choices: [gini, entropy]

  xgboost:
    enabled: true
    default_params:
      objective: binary:logistic
      eval_metric: auc
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      random_state: 42
      scale_pos_weight: 1.0
      n_jobs: -1

    search_space:
      n_estimators:
        type: int
        low: 100
        high: 1000
        step: 100
      max_depth:
        type: int
        low: 3
        high: 10
      learning_rate:
        type: float
        low: 0.01
        high: 0.3
        log: true
      subsample:
        type: float
        low: 0.6
        high: 1.0
      colsample_bytree:
        type: float
        low: 0.6
        high: 1.0

  svm:
    enabled: true
    default_params:
      kernel: rbf
      C: 1.0
      gamma: scale
      probability: true
      random_state: 42
      class_weight: balanced

    search_space:
      C:
        type: float
        low: 0.1
        high: 10.0
        log: true
      gamma:
        type: categorical
        choices: [scale, auto]
      kernel:
        type: categorical
        choices: [rbf, poly, sigmoid]

  mlp:
    enabled: true
    default_params:
      input_dim: 6144
      hidden_dim1: 512
      hidden_dim2: 256
      output_dim: 2
      dropout: 0.3

    training_params:
      lr: 1e-4
      patience: 10
      smoothing: 0.1
      scheduler_patience: 3
      scheduler_factor: 0.5
      scheduler_mode: min

    search_space:
      n_hidden_layers:
        type: int
        low: 0
        high: 3

      hidden_units:
        type: categorical
        choices: [128, 256, 512, 1024]

      width_scheme:
        type: categorical
        choices: [constant, pyramid]

      activation:
        type: categorical
        choices: [sigoid, tanh, relu, gelu, leaky_relu]

      use_batch_norm:
        type: categorical
        choices: [true, false]

      use_dropout:
        type: categorical
        choices: [true, false]

      dropout:
        type: float
        low: 0.0
        high: 0.6
        condition:
          parameter: use_dropout
          equals: true

      lr:
        type: float
        low: 1e-5
        high: 1e-2
        log: true

      optimizer:
        type: categorical
        choices: [adam, adamw]

      use_weight_decay:
        type: categorical
        choices: [true, false]

      weight_decay:
        type: float
        low: 1e-8
        high: 1e-3
        log: true
        condition:
          parameter: use_weight_decay
          equals: true